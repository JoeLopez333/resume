# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: checkout
        uses: actions/checkout@v4
        with:
             ref: 'main'
             fetch-depth: 0

      - name: build latex pdf
        uses: hspaans/latexmk-action@v2.1.1
        with:
            # File format to generate
            format: pdf
            # Source file name
            filename: resume.tex
            # Latexmk options
            options: -xelatex
            
      - name: prepare names
        id: names
        run: |
          echo "pdf_file=resume-${{ github.run_number }}.pdf" >> $GITHUB_OUTPUT
          echo "png_file=resume-${{ github.run_number }}.png" >> $GITHUB_OUTPUT

      - name: rename pdf to include run number
        run: mv resume.pdf "${{ steps.names.outputs.pdf_file }}"

      - name: install poppler-utils (pdftoppm)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: convert first page of pdf -> png
        run: |
          prefix="resume-${{ github.run_number }}"
          # create a PNG from the first page at 300 DPI
          pdftoppm -png -singlefile -rx 300 -ry 300 "${{ steps.names.outputs.pdf_file }}" "$prefix"
          # result will be $prefix.png
          # mv "${prefix}.png" "${{ steps.names.outputs.png_file }}"

     
            
      - name: upload pdf
        uses: actions/upload-artifact@v6.0.0
        with:
          name: "${{ steps.names.outputs.pdf_file }}"
          path: "${{ steps.names.outputs.pdf_file }}"
          # The desired behavior if no files are found using the provided path.
          if-no-files-found: error # optional, default is warn
          retention-days: 90 # optional
          # The level of compression for Zlib to be applied to the artifact archive. 
          # The value can range from 0 to 9: - 0: No compression - 1: Best speed - 6: Default compression (same as GNU Gzip) - 9: Best compression 
          # Higher levels will result in better compression, but will take longer to complete.
          # For large files that are not easily compressed, a value of 0 is recommended for significantly faster uploads.
          # compression-level: # optional, default is 6
          # If true, an artifact with a matching name will be deleted before a new one is uploaded. 
          # If false, the action will fail if an artifact for the given name already exists. Does not fail if the artifact does not exist.
          # overwrite: # optional, default is false
          # If true, hidden files will be included in the artifact. If false, hidden files will be excluded from the artifact.
      
          # include-hidden-files: # optional, default is false
      - name: upload png artifact
        uses: actions/upload-artifact@v6
        with:
          name: "${{ steps.names.outputs.png_file }}"
          path: "${{ steps.names.outputs.png_file }}"
          if-no-files-found: error
          overwrite: true

      - name: publish preview image to repo and update README
        env:
          PNG_FILE: ${{ steps.names.outputs.png_file }}
        run: |
          set -e

          # Ensure git identity
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout release

          # Add the image
          cp "$PNG_FILE" docs/resume-latest.png -f
          git add docs/resume-latest.png

          # Update README.md to display the preview image.
          # If README.md already references docs/resume-latest.png, replace that line; otherwise append a short section.
          if [ -f README.md ]; then
            if grep -q "docs/resume-latest.png" README.md; then
              # replace any existing image line that references docs/resume-latest.png with a standardized one
              sed -i 's|!\[.*docs/resume-latest.png.*|![Resume](docs/resume-latest.png)|g' README.md || true
            else
              echo -e "\n## Resume Preview\n\n![Resume](docs/resume-latest.png)\n" >> README.md
            fi
            git add README.md
          else
            echo -e "# Resume\n\n## Resume Preview\n\n![Resume](docs/resume-latest.png)\n" > README.md
            git add README.md
          fi

          # Commit and push (skip CI)
          git commit -m "Update resume preview image [skip ci]" || echo "No changes to commit"
          git push
      # Runs a single command using the runners shell
      # - name: build resume
      #   run: latexmk -xelatex -pvc "resume.tex"

      # # Runs a set of commands using the runners shell
      # - name: Run a multi-line script
      #   run: |
      #     echo Add other actions to build,
      #     echo test, and deploy your project.
